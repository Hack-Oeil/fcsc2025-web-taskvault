services:
  taskvault-varnish:
    image: anssi/fcsc2025-web-taskvault-varnish:latest
    environment:
      - HOOS_CTF_EMAIL=${HOOS_CTF_EMAIL:-}
      - HOOS_CTF_USERNAME=${HOOS_CTF_USERNAME:-}
      - LANGUAGE=${LANGUAGE:-fr}
    labels:
      ho.ctf.cyrhades: "challenge"
    ports:
      - ${PORT}:8000

  taskvault-apache2:
    image: anssi/fcsc2025-web-taskvault-apache2:latest

  taskvault-app:
    image: anssi/fcsc2025-web-taskvault:latest
